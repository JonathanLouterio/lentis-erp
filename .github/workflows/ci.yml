name: Lentis CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lentis-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Django e PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      # Valores exclusivos do banco descartavel deste job, sem dados reais.
      DJANGO_SECRET_KEY: lentis-ci-only-not-a-production-key-0123456789-abcdefghijklmnopqrstuvwxyz
      POSTGRES_DB: lentis_ci
      POSTGRES_USER: lentis_ci
      POSTGRES_PASSWORD: lentis_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lentis_ci
          POSTGRES_USER: lentis_ci
          POSTGRES_PASSWORD: lentis_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lentis_ci -d lentis_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Conferir dependencias instaladas
        run: python -m pip check
      - name: Conferir configuracao Django
        run: python manage.py check
      - name: Detectar migracoes nao versionadas
        run: python manage.py makemigrations --check --dry-run
      - name: Aplicar migracoes no banco descartavel
        run: python manage.py migrate --noinput
      - name: Executar todos os testes do backend
        run: python manage.py test --noinput --verbosity 2

  frontend:
    name: Frontend - TypeScript e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias do lockfile
        run: npm ci
      - name: Conferir TypeScript e gerar build
        run: npm run build
